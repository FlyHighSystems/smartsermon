<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7719aa">
<meta name="color-scheme" content="light dark">
<script>try{var m=JSON.parse(localStorage.getItem("mp-theme")||"null")||"auto";document.documentElement.dataset.theme=m==="auto"?(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):m}catch(e){}</script>
<title>SmartSermon</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237719aa'/%3E%3Cpath d='M46 22c-2-4-7-7-14-7-9 0-15 5-15 11 0 13 28 8 28 20 0 6-6 10-14 10-7 0-12-3-15-8' fill='none' stroke='%23fff' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
<style>:root{
  --accent:#7719aa;--accent-d:#5c1385;--accent-l:#f3e9f8;--bg:#f5f4f3;--panel:#fff;--panel2:#faf9f8;--line:#e3e1df;--text:#201f1e;--muted:#69676a;
  --c-point:#7719aa;--c-verse:#0f6cbd;--c-illus:#c25e00;--c-app:#107c10;--c-quote:#008575;--c-ink:#5c2e91;--c-image:#8a8886;--c-text:#8a8886;
  --sec-color:#7719aa;--radius:10px;--input:#fff;--hover:#fbfafb;--row-line:#f1efed;--ph:#b3b0ad;--point-fg:#3b0f56;--verse-bg:#f4f8fd;--verse-bg2:#edf4fc;--verse-line:#c7dcf2;--illus-bg:#fff8f1;--app-bg:#f3faf3;--quote-bg:#effaf8;--ink-bg:#fff;--ink-rule:#eef0f6;--ink-border:#d6d0e2;--sel-hover:#f2f7fd;--sel:#dcebfb;--mark:#fff1a8;--modal:#fff;color-scheme:light;--shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--text);background:var(--bg);overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
input,select{font:inherit;color:inherit}
.muted{color:var(--muted)} .small{font-size:.85em} .pad{padding:12px}
[hidden]{display:none!important}

/* Tema escuro (segue o Windows quando em "Automático") */
html[data-theme=dark]{color-scheme:dark;--accent:#8b2fc0;--accent-d:#a24fd6;--accent-l:#3a2650;--bg:#18171c;--panel:#212026;--panel2:#1b1a20;--line:#38353f;--text:#ecebef;--muted:#a8a4ae;
  --c-point:#c48cf0;--c-verse:#6cb4ff;--c-illus:#f0a35e;--c-app:#6ccb6c;--c-quote:#4fd1bd;--c-ink:#b08ae0;--c-text:#9a96a1;
  --input:#2a2830;--hover:#26242c;--row-line:#2b2930;--ph:#6f6b76;--point-fg:#e6cdfa;--verse-bg:#1b2533;--verse-bg2:#1f2b3b;--verse-line:#2f4866;--illus-bg:#2c2219;--app-bg:#1b2a1d;--quote-bg:#17292a;
  --ink-bg:#1f1e24;--ink-rule:#2c2a33;--ink-border:#45404f;--sel-hover:#1f2a38;--sel:#22374f;--mark:#e8c547;--modal:#26242b;--shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3)}
html[data-theme=dark] .topbar{background:#2a1838}
html[data-theme=dark] .btn.preach{background:#c48cf0;border-color:#c48cf0;color:#1b1020}
html[data-theme=dark] .rtab.on{color:#e6cdfa}
html[data-theme=dark] .btn.link,html[data-theme=dark] .danger-text{color:var(--c-point)}html[data-theme=dark] .danger-text{color:#ff8a8a}
html[data-theme=dark] .icon-btn:hover,html[data-theme=dark] .sec:hover{background:rgba(255,255,255,.07)}
html[data-theme=dark] .modal-back{background:rgba(0,0,0,.6)}
html[data-theme=dark] .sw{border-color:var(--panel)}
/* texto preto escolhido no claro continua legível no escuro; texto com marca-texto fica escuro */
html[data-theme=dark] .b-body [style*="color: rgb(32, 31, 30)"],html[data-theme=dark] .b-body [style*="color:#201f1e"],html[data-theme=dark] .r-text [style*="color: rgb(32, 31, 30)"]{color:inherit!important}
html[data-theme=dark] .b-body [style*="background-color"]{color:#111}
.theme-btn{font-size:14px!important;padding:0 8px;width:auto;gap:4px;display:inline-flex!important;align-items:center}

/* Topo */
.topbar{display:flex;align-items:center;gap:10px;height:48px;padding:0 10px;background:var(--accent);color:#fff;flex-shrink:0}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;margin-right:6px;white-space:nowrap}
.logo{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;background:#fff;color:var(--accent);font-weight:800}
.rtabs{display:flex;gap:2px;height:100%;align-items:flex-end}
.rtab{border:0;background:transparent;color:#fff;opacity:.85;padding:8px 14px;height:38px;border-radius:8px 8px 0 0}
.rtab.on{background:var(--panel);color:var(--accent);opacity:1;font-weight:600}
.top-right{margin-left:auto;display:flex;gap:6px;align-items:center}
.topbar .icon-btn{color:#fff}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 14px;min-height:36px;white-space:nowrap}
.btn:hover{background:var(--panel2)} .btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff} .btn.primary:hover{background:var(--accent-d)}
.btn.danger{background:#c50f1f;border-color:#c50f1f;color:#fff} .danger-text{color:#c50f1f}
.btn.sm{padding:4px 10px;min-height:30px;font-size:.92em}
.btn.ghost{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff} .btn.ghost:hover{background:rgba(255,255,255,.22)}
.btn.preach{background:#fff;color:var(--accent);border-color:#fff;font-weight:700}
.btn.link{border:0;background:none;color:var(--accent);text-align:left;padding:8px 12px}
.icon-btn{border:0;background:transparent;border-radius:8px;min-width:36px;min-height:36px;font-size:18px;display:inline-grid;place-items:center}
.icon-btn:hover{background:rgba(0,0,0,.06)} .icon-btn.sm{min-width:30px;min-height:30px;font-size:15px}
.inp{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--input);min-height:36px}
.inp:focus{outline:2px solid var(--accent);outline-offset:-1px}

/* Ribbon */
.ribbon-body{background:var(--panel);border-bottom:1px solid var(--line);min-height:52px;display:flex;align-items:center;padding:6px 10px;flex-shrink:0}
.rpanel{display:flex;align-items:center;gap:4px 6px;flex-wrap:wrap}
.rgroup{display:flex;align-items:center;gap:4px;padding:0 10px;border-right:1px solid var(--line)}
.rgroup:last-of-type{border-right:0}
.rlabel{font-size:12px;color:var(--muted);margin-right:2px}
.rb{border:1px solid transparent;background:transparent;border-radius:6px;min-height:36px;min-width:36px;padding:4px 10px;white-space:nowrap}
.rb:hover{background:var(--accent-l)} .rb.on{background:var(--accent-l);border-color:var(--accent);color:var(--accent)}
.rb.b{font-weight:800}.rb.i{font-style:italic;font-family:Georgia,serif}.rb.u{text-decoration:underline}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);padding:0}
.sw.on{box-shadow:0 0 0 2px var(--accent)} .sw.none{background:var(--input);font-size:13px;color:var(--muted)}
.rcheck{display:flex;align-items:center;gap:6px;font-size:14px;padding:0 6px;white-space:nowrap}
.rhint{font-size:12px;color:var(--muted);padding-left:6px}
.t-point{color:var(--c-point)}.t-verse{color:var(--c-verse)}.t-illus{color:var(--c-illus)}.t-app{color:var(--c-app)}.t-quote{color:var(--c-quote)}.t-ink{color:var(--c-ink)}

/* Layout principal estilo OneNote */
.main{flex:1;display:flex;min-height:0}
#nb-pane{width:220px;background:var(--panel2);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:auto;flex-shrink:0}
#pages-pane{width:260px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0;border-top:4px solid var(--sec-color)}
.nav-collapsed #nb-pane,.nav-collapsed #pages-pane{display:none}
.pane-head{display:flex;align-items:center;gap:4px;padding:8px}
.pane-head select{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--input);font-weight:600;min-height:34px}
#pages-pane .pane-head b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;margin:2px 6px;border-radius:8px;cursor:pointer;min-height:40px}
.sec:hover{background:rgba(0,0,0,.04)} .sec.active{background:var(--panel);box-shadow:var(--shadow);font-weight:600}
.sec-dot{width:12px;height:12px;border-radius:3px;background:var(--sc);flex-shrink:0}
.sec-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sec-count{font-size:12px;color:var(--muted)}
.sec .icon-btn{opacity:0}.sec:hover .icon-btn,.sec.active .icon-btn{opacity:1}
.search{margin:0 8px 6px;width:calc(100% - 16px)}
#page-list{overflow:auto;flex:1}
.page{padding:10px 14px;border-left:3px solid transparent;cursor:pointer;border-bottom:1px solid var(--row-line)}
.page:hover{background:var(--panel2)} .page.active{background:var(--accent-l);border-left-color:var(--sec-color)}
.page-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}

/* Editor */
#editor{flex:1;overflow:auto;background:var(--panel);min-width:0}
#editor-inner{max-width:900px;margin:0 auto;padding:22px 34px 140px}
.s-title{width:100%;border:0;font-size:30px;font-weight:600;padding:4px 0;border-bottom:1px solid var(--line);outline:none;background:transparent;font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif}
.s-meta{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:13px;color:var(--muted);padding:10px 0 18px}
.s-meta input,.s-meta select{border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--input);min-height:30px}
.s-est{background:var(--accent-l);color:var(--accent-d);border-radius:999px;padding:3px 10px;font-weight:600;cursor:help}
.s-actions{margin-left:auto;display:flex;gap:6px}
.block{position:relative;margin:6px 0;padding:8px 12px 8px 14px;border-radius:var(--radius);border-left:3px solid transparent;transition:background .15s}
.block:hover,.block.focus{background:var(--hover)}
.block.focus{box-shadow:inset 0 0 0 1px var(--line)}
.b-tag{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--c-text);user-select:none;margin-bottom:2px}
.b-tools{position:absolute;top:4px;right:6px;display:flex;gap:2px;opacity:0;transition:opacity .15s}
.block:hover .b-tools,.block.focus .b-tools{opacity:1}
@media (hover:none){.b-tools{opacity:.55}}
.b-body{outline:none;min-height:1.5em;font-size:17px;line-height:1.6;word-wrap:break-word}
.b-body:empty:before{content:attr(data-ph);color:var(--ph);pointer-events:none}
.b-point{border-left-color:var(--c-point);margin-top:22px}
.b-point .b-tag{color:var(--c-point)} .b-point .b-body{font-size:23px;font-weight:600;color:var(--point-fg)}
.b-verse{border-left-color:var(--c-verse);background:var(--verse-bg)}.b-verse:hover,.b-verse.focus{background:var(--verse-bg2)}
.b-verse .b-tag{color:var(--c-verse)} .b-verse .b-body{font-family:Georgia,"Times New Roman",serif;font-style:italic}
.verse-head{display:flex;gap:6px;align-items:center;margin:4px 0 6px;flex-wrap:wrap}
.verse-ref{flex:1;min-width:180px;border:1px solid var(--verse-line);border-radius:6px;padding:5px 8px;font-weight:600;color:var(--c-verse);background:#fff;min-height:32px}
.verse-version{border:1px solid var(--verse-line);border-radius:6px;padding:4px;min-height:32px;background:var(--input)}
.b-illus{border-left-color:var(--c-illus);background:var(--illus-bg)}.b-illus .b-tag{color:var(--c-illus)}
.b-app{border-left-color:var(--c-app);background:var(--app-bg)}.b-app .b-tag{color:var(--c-app)}
.b-quote{border-left-color:var(--c-quote);background:var(--quote-bg)}.b-quote .b-tag{color:var(--c-quote)}.b-quote .b-body{font-weight:600;font-size:19px}
.b-ink{border-left-color:var(--c-ink)}.b-ink .b-tag{color:var(--c-ink)}
.ink-wrap{width:100%;background-image:linear-gradient(var(--ink-rule) 1px,transparent 1px);background-size:100% 28px;border-radius:8px;border:1px dashed var(--ink-border);overflow:hidden;background-color:var(--ink-bg)}
.ink-canvas{display:block;cursor:crosshair;touch-action:none}
body[data-inktool=eraser] .ink-canvas{cursor:cell}
.ink-grip{text-align:center;color:#a19bb0;cursor:ns-resize;user-select:none;touch-action:none;height:22px;line-height:14px;font-size:20px}
.b-image .b-img{max-width:100%;border-radius:8px;display:block}
.b-caption{font-size:14px;color:var(--muted);margin-top:4px}
.add-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:26px;padding-top:14px;border-top:1px dashed var(--line)}
.chip{border:1px solid var(--line);background:var(--input);border-radius:999px;padding:6px 12px;min-height:34px;font-size:14px}
.chip:hover{background:var(--panel2)} .chip.on{border-color:var(--accent);background:var(--accent-l)}
.type-grid{display:flex;flex-wrap:wrap;gap:8px}
.empty-state{text-align:center;padding:80px 20px;color:var(--muted)}

/* Bíblia */
#bible-pane{width:380px;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;flex-shrink:0}
.bp-head,.bp-search,.bp-nav{display:flex;gap:6px;padding:8px;align-items:center}
.bp-head select{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:6px;min-height:34px;font-weight:600}
.bp-nav select{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:6px;min-height:34px}
.bp-nav select#bp-chapter{flex:0 0 72px}
#bp-verses{flex:1;overflow:auto;padding:4px 14px 20px;font-family:Georgia,"Times New Roman",serif;font-size:17px;line-height:1.6}
.bp-title{font-family:"Segoe UI",sans-serif;margin:8px 0;color:var(--c-verse)}
.bp-v{padding:4px 6px;border-radius:6px;cursor:pointer}
.bp-v:hover{background:var(--sel-hover)} .bp-v.sel{background:var(--sel);box-shadow:inset 3px 0 0 var(--c-verse)}
.bp-v sup{color:var(--c-verse);font-family:"Segoe UI",sans-serif;font-weight:700;font-size:.65em;margin-right:2px}
.bp-v mark{background:var(--mark);color:#111}
.bp-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px;border-top:1px solid var(--line)}
.bp-attrib{font-size:11px;color:var(--muted);padding:0 10px 8px}
.bp-empty{text-align:center;padding:30px 10px;display:flex;flex-direction:column;gap:12px;align-items:center;font-family:"Segoe UI",sans-serif}
.bm-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.pill{font-size:11px;border-radius:999px;padding:2px 8px;margin-left:8px;background:#fdf0d8;color:#8a5a00}.pill.ok{background:#dff6dd;color:#0b5a0b}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden}.progress>div{height:100%;width:3%;background:var(--accent);transition:width .2s}

/* Modais, toasts */
.modal-back{position:fixed;inset:0;background:rgba(20,10,30,.35);display:grid;place-items:center;z-index:100;padding:16px}
.modal{background:var(--modal);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:min(460px,100%);max-height:90vh;display:flex;flex-direction:column}
.modal.wide{width:min(720px,100%)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}.modal-head h3{margin:0;font-size:18px}
.modal-body{padding:6px 18px 12px;overflow:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}.swatch{width:32px;height:32px;border-radius:8px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}.swatch.on{box-shadow:0 0 0 2px var(--text)}
.imp{display:grid;gap:12px}.imp-card{border:1px solid var(--line);border-radius:12px;padding:12px 14px}.imp-card h4{margin:0 0 6px}
.row-btns{display:flex;gap:8px}
.paste-area{min-height:90px;max-height:200px;overflow:auto;border:1px dashed var(--line);border-radius:8px;padding:8px;margin:6px 0 10px;outline:none;font-size:14px}
.paste-area:empty:before{content:attr(data-ph);color:#a19f9d}
#toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:200;pointer-events:none}
.toast{background:#2b2830;color:#fff;padding:10px 14px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;gap:12px;align-items:center;pointer-events:auto;transition:opacity .4s,transform .4s;font-size:14px;max-width:90vw}
.toast button{background:transparent;border:0;color:#d9b8f0;font-weight:700}
.toast.out{opacity:0;transform:translateY(8px)}
.fatal{background:#c50f1f;color:#fff;padding:12px}

/* ===== Modo leitura ===== */
#reader{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;--rbg:#111214;--rfg:#ededed;--rmuted:#9a9aa3;--rpoint:#d7b4f0;--rverse:#8cc4ff;--rline:#2a2b30;background:var(--rbg);color:var(--rfg)}
#reader[data-theme=sepia]{--rbg:#f4ecd8;--rfg:#3b2f22;--rmuted:#8a7a63;--rpoint:#7a2e8f;--rverse:#2c5b8f;--rline:#e2d6bb}
#reader[data-theme=light]{--rbg:#ffffff;--rfg:#1d1d1f;--rmuted:#6e6e73;--rpoint:#7719aa;--rverse:#0f6cbd;--rline:#e6e6e6}
.r-top{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--rline);transition:opacity .4s;flex-wrap:wrap}
#reader.playing .r-top{opacity:.25}#reader.playing .r-top:hover{opacity:1}
.r-btn{background:transparent;border:1px solid var(--rline);color:var(--rfg);border-radius:8px;min-width:40px;min-height:40px;font-size:16px}
.r-title{flex:1;min-width:80px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--rmuted)}
.r-seg{display:flex;border:1px solid var(--rline);border-radius:8px;overflow:hidden}
.r-seg button{background:transparent;border:0;color:var(--rmuted);padding:0 12px;min-height:38px}
.r-seg button.on{background:var(--rpoint);color:var(--rbg);font-weight:600}
.r-grp{display:flex;align-items:center;gap:4px}.r-val{min-width:32px;text-align:center;color:var(--rmuted);font-size:13px}
#reader[data-mode=points] .only-scroll{display:none}
.r-timer{font-variant-numeric:tabular-nums;font-weight:700;padding:6px 10px;border-radius:8px;cursor:pointer;background:rgba(127,127,127,.12)}
.r-timer.yellow{background:#f7c948;color:#222}.r-timer.red{background:#e5484d;color:#fff}.r-timer.over{background:#e5484d;color:#fff;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.4}}
.r-est{font-size:13px;color:var(--rmuted);padding:0 6px;white-space:nowrap;font-variant-numeric:tabular-nums}.r-est.late{color:#f0883e;font-weight:600}
.r-clock{color:var(--rmuted);font-variant-numeric:tabular-nums;font-size:13px;padding-left:4px}
#r-scroll{flex:1;overflow-y:auto;touch-action:pan-y;user-select:none;-webkit-user-select:none;scroll-behavior:auto}
#reader.playing #r-scroll{cursor:none}
#r-content{max-width:46em;margin:0 auto;padding:4vh 5vw 40vh;line-height:1.5}
#reader[data-mode=points] #r-content{padding-bottom:10vh}
#reader.serif #r-content{font-family:Georgia,"Cambria","Times New Roman",serif}
.r-h1{font-size:1.25em;margin:0 0 .2em;color:var(--rmuted);font-weight:600}
.r-passage{color:var(--rverse);font-size:.8em;margin-bottom:1em}
.r-point{font-size:1.3em;color:var(--rpoint);margin:1.3em 0 .4em;line-height:1.25}.r-num{opacity:.7}
.r-text{margin:.4em 0}.r-text div{margin-bottom:.35em}
.r-verse{margin:.8em 0;padding:.2em 0 .2em .8em;border-left:.18em solid var(--rverse);font-style:italic}

<script>'use strict';
/* ===== Utilidades básicas ===== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const stripAccents = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '');
const todayISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'style' && typeof v === 'object') { for (const [sk, sv] of Object.entries(v)) { if (sk.startsWith('--')) e.style.setProperty(sk, sv); else e.style[sk] = sv; } }
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
}
function htmlToText(html) {
  if (!html) return '';
  // <template> é inerte: não baixa imagens nem executa nada
  const t = document.createElement('template'); t.innerHTML = String(html).replace(/<br\s*\/?>/gi, '\n').replace(/<\/(p|div|li|h\d)>/gi, '$&\n');
  return t.content.textContent.replace(/[ \t\u00a0]+/g, ' ').replace(/\n\s*\n+/g, '\n').trim();

/* ===== IndexedDB com fallback em memória ===== */
const DB = (() => {
  let db = null; const mem = { sermons: new Map(), kv: new Map(), bibles: new Map(), images: new Map() };
  const api = {
    volatile: false,
    async init() {
      try {
        db = await new Promise((res, rej) => {
          const r = indexedDB.open('pulpito', 2);
          r.onupgradeneeded = () => { const d = r.result; for (const s of ['sermons', 'kv', 'bibles', 'images']) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s); };
          r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
          setTimeout(() => rej(new Error('timeout')), 4000);
        });
        try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) { }
      } catch (e) { console.warn('IndexedDB indisponível', e); api.volatile = true; }
    },
    tx(store, mode, fn) {
      if (!db) return Promise.resolve(fn(null, mem[store]));
      return new Promise((res, rej) => {
        const t = db.transaction(store, mode); const s = t.objectStore(store); const r = fn(s);
        t.oncomplete = () => res(r && 'result' in r ? r.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
      });
    },
    get(s, k) { return api.tx(s, 'readonly', (st, m) => st ? st.get(k) : m.get(k)); },
    put(s, k, v) { return api.tx(s, 'readwrite', (st, m) => st ? st.put(v, k) : void m.set(k, structuredClone(v))); },
    del(s, k) { return api.tx(s, 'readwrite', (st, m) => st ? st.delete(k) : void m.delete(k)); },
    all(s) { return api.tx(s, 'readonly', (st, m) => st ? st.getAll() : [...m.values()]); },
  };
  return api;
})();

/* ===== Toast e modais ===== */
const UI = {
  toast(msg, action) {
    const host = $('#toasts');
    const t = el('div', { class: 'toast' }, el('span', { text: msg }));
    if (action) t.append(el('button', { text: action.label, onclick: () => { action.fn(); t.remove(); } }));
    host.append(t); setTimeout(() => t.classList.add('out'), action ? 5500 : 2800); setTimeout(() => t.remove(), action ? 6000 : 3300);
  },
  modal({ title, body, actions = [], wide = false, onClose }) {
    const back = el('div', { class: 'modal-back' });
    const box = el('div', { class: 'modal' + (wide ? ' wide' : '') });
    const close = () => { back.remove(); onClose && onClose(); };
    box.append(el('div', { class: 'modal-head' }, el('h3', { text: title }), el('button', { class: 'icon-btn', 'aria-label': 'Fechar', text: '✕', onclick: close })));
    const b = el('div', { class: 'modal-body' }); if (typeof body === 'string') b.innerHTML = body; else if (body) b.append(body);
    box.append(b);
    if (actions.length) box.append(el('div', { class: 'modal-foot' }, actions.map(a => el('button', { class: a.primary ? 'btn primary' : (a.danger ? 'btn danger' : 'btn'), text: a.label, onclick: async () => { const r = await a.onClick?.(); if (r !== false) close(); } }))));
    back.addEventListener('pointerdown', e => { if (e.target === back) close(); });
    back.append(box); document.body.append(back);
    setTimeout(() => { const f = box.querySelector('input,textarea,select'); f && f.focus(); }, 30);
    return { close, box, body: b };
  },
  ask(title, value = '', label = '') {
    return new Promise(res => {
      const inp = el('input', { class: 'inp', value, placeholder: label });
      let done = false;
      const m = UI.modal({ title, body: inp, onClose: () => { if (!done) res(null); }, actions: [{ label: 'Cancelar', onClick: () => { } }, { label: 'OK', primary: true, onClick: () => { done = true; res(inp.value.trim()); } }] });
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') { done = true; res(inp.value.trim()); m.close(); } });
    });
  },
  confirm(title, text, okLabel = 'Excluir') {
    return new Promise(res => {
      let done = false;
      UI.modal({ title, body: el('p', { text }), onClose: () => { if (!done) res(false); }, actions: [{ label: 'Cancelar' }, { label: okLabel, danger: true, onClick: () => { done = true; res(true); } }] });
    });
  }
};

async function saveFile(filename, blob) {

      if (dl) { await dl.save({ filename, data: blob }); return; }
    }
  } catch (e) { console.warn('downloads capability falhou', e); }
  const url = URL.createObjectURL(blob);
  const a = el('a', { href: url, download: filename }); document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

const BookIndex = (() => {

  const norm = s => String(s).toLowerCase().replace(/[\s.]/g, '');

/* Interpreta referências como "Jo 3:16-18", "1 Co 13", "Sl 23.1", "Rm 8:28,31" */
function parseRef(str) {
  if (!str) return null;
  const m = String(str).trim().match(/^((?:[1-3]|i{1,3})?\s*[a-zà-ÿ][a-zà-ÿ.\s]*?)\s*(\d{1,3})(?:\s*[:.]\s*(\d{1,3})(?:\s*[-–]\s*(\d{1,3}))?((?:\s*,\s*\d{1,3}(?:\s*[-–]\s*\d{1,3})?)*))?\s*$/i);
  if (!m) return null;
  const book = BookIndex.find(m[1]); if (!book) return null;
  const ch = +m[2];
  const ranges = [];
  if (m[3]) {
    ranges.push([+m[3], m[4] ? +m[4] : +m[3]]);
    if (m[5]) for (const part of m[5].split(',').map(x => x.trim()).filter(Boolean)) { const [a, b] = part.split(/[-–]/).map(x => +x.trim()); ranges.push([a, b || a]); }
  }
  return { book, ch, ranges };
}
function refLabel(r) {
  if (!r) return '';
  const b = BOOKS[r.book - 1];
  let s = `${b.name} ${r.ch}`;
  if (r.ranges && r.ranges.length) s += ':' + r.ranges.map(([a, z]) => a === z ? a : `${a}-${z}`).join(',');
  return s;
}

/* Converte formatos conhecidos para: books[0..65] = [capítulo][versículo] = texto */
function normalizeBible(json) {

  const verseArr = verses => { const a = []; (verses || []).forEach((v, i) => { if (typeof v === 'string') a[i] = v; else if (v) a[(v.number || v.verse || i + 1) - 1] = v.text ?? v.t ?? ''; }); return a; };

    json.books.forEach((b, i) => { const id = b.bookId || b.id || (i + 1); if (id >= 1 && id <= 66) out[id - 1] = chapArr(b.chapters); });

  }

}

const Bible = {
  cache: {}, installed: [],
  async init() { this.installed = (await DB.get('kv', 'bibles')) || []; BiblePane.refreshVersions(); },
  has(id) { return this.installed.some(b => b.id === id); },
  current() { const v = App.meta.bibleVersion; if (v && this.has(v)) return v; return this.installed[0]?.id || null; },
  info(id) { return this.installed.find(b => b.id === id) || BIBLE_SOURCES.find(b => b.id === id); },
  async load(id) {
    if (!id) return null;
    if (this.cache[id]) return this.cache[id];
    const d = await DB.get('bibles', id); if (d) this.cache[id] = d.books; return this.cache[id] || null;
  },
  async fetchJSON(url, onProgress) {
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const total = +res.headers.get('content-length') || 0;
    let text;
    if (res.body && onProgress) {
      const reader = res.body.getReader(); const chunks = []; let got = 0;
      for (; ;) { const { done, value } = await reader.read(); if (done) break; chunks.push(value); got += value.length; onProgress(total ? got / total : null, got); }

    } else text = await res.text();
    return JSON.parse(text.replace(/^﻿/, ''));
  },
  async download(src, onProgress) {
    let books = null, lastErr;
    for (const url of src.urls) {
      try { books = normalizeBible(await this.fetchJSON(url, onProgress)); if (books) break; } catch (e) { lastErr = e; console.warn(url, e); }
    }
    if (!books && src.perBook) { // alternativa: livro por livro
      books = new Array(66).fill(null);
      for (const b of BOOKS) {
        onProgress && onProgress(b.id / 66, 0, b.name);
        try { const j = await this.fetchJSON(src.perBook.replace('{OSIS}', b.osis)); books[b.id - 1] = normalizeBible({ books: [{ bookId: b.id, chapters: j.chapters }] })[b.id - 1]; } catch (e) { lastErr = e; }
      }
      if (!books.some(Boolean)) books = null;
    }
    if (!books) throw lastErr || new Error('Falha no download');
    await this.store({ id: src.id, short: src.short, name: src.name, license: src.license }, books);
  },
  async store(info, books) {
    await DB.put('bibles', info.id, { ...info, books });
    this.cache[info.id] = books;
    this.installed = this.installed.filter(b => b.id !== info.id).concat([{ ...info, verses: books.reduce((n, b) => n + (b ? b.reduce((m, c) => m + c.length, 0) : 0), 0) }]);
    await DB.put('kv', 'bibles', this.installed);
    if (!App.meta.bibleVersion) { App.meta.bibleVersion = info.id; App.saveMeta(); }
    BiblePane.refreshVersions();
    App.fillMissingVerses();
  },
  async importFile(file) {
    const json = JSON.parse((await file.text()).replace(/^﻿/, ''));
    const books = normalizeBible(json);
    if (!books) throw new Error('Arquivo contém só um livro; use um arquivo da Bíblia completa.');
    const base = file.name.replace(/\.json$/i, '');
    const name = (await UI.ask('Nome desta versão', json.name || base)) || base;
    const short = (await UI.ask('Sigla', (json.abbreviation || base).toUpperCase().slice(0, 8))) || base.toUpperCase().slice(0, 8);
    await this.store({ id: 'u-' + stripAccents(short).toLowerCase().replace(/\W/g, ''), short, name, license: 'Importada pelo usuário' }, books);
  },
  async remove(id) {

    this.installed = this.installed.filter(b => b.id !== id); await DB.put('kv', 'bibles', this.installed);

    BiblePane.refreshVersions();
  },
  /* Retorna {label, verses:[[n, texto]]} */
  async lookup(refStr, version) {
    const r = typeof refStr === 'string' ? parseRef(refStr) : refStr;
    if (!r) return { error: 'Referência não reconhecida' };
    version = version || this.current();
    const books = await this.load(version);
    if (!books) return { error: 'Nenhuma Bíblia baixada', r };
    const ch = books[r.book - 1]?.[r.ch - 1];
    if (!ch) return { error: 'Capítulo não encontrado nesta versão', r };
    const verses = [];
    const ranges = r.ranges.length ? r.ranges : [[1, ch.length]];
    for (const [a, z] of ranges) for (let v = a; v <= Math.min(z, ch.length); v++) if (ch[v - 1] != null) verses.push([v, ch[v - 1]]);
    if (!verses.length) return { error: 'Versículo não encontrado', r };
    return { label: refLabel(r), verses, r, version };
  },
  versesHTML(verses) { return verses.length === 1 ? esc(verses[0][1]) : verses.map(([n, t]) => `<sup>${n}</sup>${esc(t)}`).join(' '); },
  async search(q, version, limit = 300) {
    const books = await this.load(version || this.current()); if (!books) return [];
    const nq = stripAccents(q.toLowerCase()); const out = [];
    for (let b = 0; b < 66 && out.length < limit; b++) {
      const bk = books[b]; if (!bk) continue;
      for (let c = 0; c < bk.length && out.length < limit; c++) for (let v = 0; v < bk[c].length; v++) {
        const t = bk[c][v]; if (t && stripAccents(t.toLowerCase()).includes(nq)) { out.push({ book: b + 1, ch: c + 1, v: v + 1, t }); if (out.length >= limit) break; }

    }
    return out;
  }
};

/* Renderiza tinta como PNG (para exportação) */

/* ===== Estimativa de duração =====
   Base: palavras faladas ÷ ritmo (130 palavras/min por padrão) + tempo extra para desenhos/imagens.
   Calibração: cada pregação registrada ensina o seu ritmo real (minutos por palavra das SUAS notas),
   o que corrige automaticamente o fato de anotações em tópicos renderem muito mais tempo falado. */
const Estimate = {
  WPM: 130, EXTRA_VISUAL: 0.5,
  words(html) { const t = htmlToText(html); return t ? t.split(/\s+/).filter(Boolean).length : 0; },
  blockWords(b) { return b.type === 'ink' || b.type === 'image' ? 0 : this.words(b.html) + (b.type === 'verse' ? this.words(b.ref || '') : 0); },
  blockExtraMin(b) { return (b.type === 'ink' && b.ink?.strokes?.length) || b.type === 'image' ? this.EXTRA_VISUAL : 0; },
  samples() {
    const out = [];
    for (const s of App.sermons.values()) for (const p of (s.preached || [])) if (p.calib !== false && p.words > 30 && p.minutes >= 3) out.push({ k: p.minutes / p.words, t: p.at || 0 });
    return out.sort((a, b) => b.t - a.t).slice(0, 12);
  },
  /* minutos por palavra: mediana das pregações registradas; senão, padrão */
  rate() {
    const s = this.samples(); if (!s.length) return { k: 1 / this.WPM, n: 0 };
    const ks = s.map(x => x.k).sort((a, b) => a - b); const m = ks.length >> 1;
    return { k: ks.length % 2 ? ks[m] : (ks[m - 1] + ks[m]) / 2, n: ks.length };
  },
  ofBlocks(blocks, k) { let w = 0, extra = 0; for (const b of blocks) { w += this.blockWords(b); extra += this.blockExtraMin(b); } return { words: w, minutes: w * k + extra }; },
  sermon(s) { const r = this.rate(); const e = this.ofBlocks(s.blocks, r.k); return { ...e, calibrated: r.n, wpm: Math.round(1 / r.k) }; },
  fmt(min) { if (min < 1) return '< 1 min'; const m = Math.round(min); return m < 60 ? `${m} min` : `${Math.floor(m / 60)}h${String(m % 60).padStart(2, '0')}`; },
  label(e) { return e.calibrated ? `pelo seu ritmo real (${e.calibrated} pregação${e.calibrated > 1 ? 'ões' : ''} registrada${e.calibrated > 1 ? 's' : ''})` : `padrão de ${this.WPM} palavras/min — registre suas pregações para calibrar`; }
};

/* Botão direito ou toque longo (dedo/caneta) abre um menu */
function bindContextMenu(node, open) {
  let t = null, x0 = 0, y0 = 0, fired = 0;
  const fire = () => { const now = Date.now(); if (now - fired < 700) return; fired = now; open(); };
  node.addEventListener('contextmenu', e => { e.preventDefault(); fire(); });
  node.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse') return; x0 = e.clientX; y0 = e.clientY; clearTimeout(t);
    t = setTimeout(() => { t = null; node.classList.add('pressed'); setTimeout(() => node.classList.remove('pressed'), 200); try { navigator.vibrate && navigator.vibrate(15); } catch (_) { } fire(); }, 550);
  });
  node.addEventListener('pointermove', e => { if (t && Math.hypot(e.clientX - x0, e.clientY - y0) > 10) { clearTimeout(t); t = null; } });
  ['pointerup', 'pointercancel', 'pointerleave', 'dragstart'].forEach(ev => node.addEventListener(ev, () => { clearTimeout(t); t = null; }));
  // depois do toque longo, ignora o "clique" que vem em seguida
  node.addEventListener('click', e => { if (Date.now() - fired < 700) { e.stopPropagation(); e.preventDefault(); } }, true);
}

/* ===== Sanitização de HTML colado/importado ===== */
function sanitizeHTML(html, inlineOnly = false) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const allowed = new Set(['B', 'STRONG', 'I', 'EM', 'U', 'BR', 'P', 'DIV', 'UL', 'OL', 'LI', 'SPAN', 'MARK', 'SUP', 'SUB', 'S']);
  const walk = node => {
    for (const c of [...node.childNodes]) {
      if (c.nodeType === 8) { c.remove(); continue; }
      if (c.nodeType !== 1) continue;
      if (['SCRIPT', 'STYLE', 'META', 'LINK', 'TITLE', 'XML', 'HEAD'].includes(c.tagName) || c.tagName.includes(':')) { c.remove(); continue; }
      walk(c);
      const st = c.getAttribute('style') || '';
      if (/font-weight:\s*(bold|[6-9]00)/i.test(st) && c.tagName === 'SPAN') { const b = document.createElement('b'); b.append(...c.childNodes); c.replaceWith(b); continue; }
      if (/font-style:\s*italic/i.test(st) && c.tagName === 'SPAN') { const b = document.createElement('i'); b.append(...c.childNodes); c.replaceWith(b); continue; }
      if (!allowed.has(c.tagName) || (inlineOnly && ['P', 'DIV', 'UL', 'OL', 'LI'].includes(c.tagName))) {
        const frag = document.createDocumentFragment(); frag.append(...c.childNodes);
        if (!inlineOnly && /^(H[1-6]|TR|TABLE|SECTION|ARTICLE|BLOCKQUOTE)$/.test(c.tagName)) { const d = document.createElement('div'); d.append(frag); c.replaceWith(d); } else c.replaceWith(frag);
        continue;
      }
      const keep = {};
      const color = st.match(/(?:^|;)\s*color:\s*([^;]+)/i), bg = st.match(/background(?:-color)?:\s*([^;]+)/i);
      [...c.attributes].forEach(a => c.removeAttribute(a.name));
      if (c.tagName === 'SPAN' || c.tagName === 'MARK') {
        if (color && !/windowtext|black|#000000|rgb\(0,\s*0,\s*0\)/i.test(color[1])) keep.color = color[1];
        if (bg && !/white|transparent|#fff|initial/i.test(bg[1])) keep['background-color'] = bg[1];
        const css = Object.entries(keep).map(([k, v]) => `${k}:${v.trim()}`).join(';'); if (css) c.setAttribute('style', css);
      }
      if (c.tagName === 'P') { const d = document.createElement('div'); d.append(...c.childNodes); c.replaceWith(d); }
    }
  };
  walk(doc.body);
  return doc.body.innerHTML.replace(/&nbsp;/g, ' ').replace(/(<div>\s*<\/div>)+/g, '').trim();
}

function imageFileToDataURL(file, maxW = 1600) {

/* ===== Conversão de página do OneNote ===== */
function orderOneNoteHTML(html) {
  // As caixas do OneNote são posicionadas livremente: ordena por posição (de cima para baixo, da esquerda para a direita)
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const kids = [...doc.body.children];
  const pos = e => { const st = e.getAttribute('style') || ''; const top = +(st.match(/top:\s*([\d.]+)px/) || [])[1] || 0; const left = +(st.match(/left:\s*([\d.]+)px/) || [])[1] || 0; return { top, left }; };
  kids.sort((a, b) => { const A = pos(a), B = pos(b); return Math.abs(A.top - B.top) < 12 ? A.left - B.left : A.top - B.top; });
  kids.forEach(k => doc.body.append(k));
  return { doc, body: doc.body.innerHTML };
}
/* InkML → blocos de desenho do SmartSermon (um por grupo de traços próximos verticalmente) */
function inkmlToInks(xml) {
  if (!xml) return [];
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) return [];
  const byTag = t => [...doc.getElementsByTagNameNS('*', t)];
  const brushes = {};
  for (const b of byTag('brush')) {
    const id = b.getAttribute('xml:id') || b.getAttributeNS('http://www.w3.org/XML/1998/namespace', 'id') || b.getAttribute('id');
    const props = {}; for (const p of b.getElementsByTagNameNS('*', 'brushProperty')) props[p.getAttribute('name')] = { v: p.getAttribute('value'), u: p.getAttribute('units') };
    brushes[id] = props;
  }

  const tf = byTag('traceFormat')[0];
  if (tf) { const ch = [...tf.getElementsByTagNameNS('*', 'channel')].map(c => c.getAttribute('name')); if (ch.length) channels = ch; }
  const ix = channels.indexOf('X'), iy = channels.indexOf('Y'), iF = channels.indexOf('F');
  const traces = [];
  for (const tr of byTag('trace')) {
    const n = channels.length, val = new Array(n).fill(0), vel = new Array(n).fill(0), mode = new Array(n).fill('!');
    const pts = [];
    for (const raw of tr.textContent.split(',')) {
      const toks = [...raw.matchAll(/([!'"]?)\s*(-?\d*\.?\d+(?:[eE][-+]?\d+)?)/g)]; if (!toks.length) continue;
      toks.slice(0, n).forEach(([, pre, num], c) => {
        const v = parseFloat(num); if (pre) mode[c] = pre;
        if (mode[c] === '!') { vel[c] = v - val[c]; val[c] = v; }
        else if (mode[c] === "'") { vel[c] = v; val[c] += v; }
        else { vel[c] += v; val[c] += vel[c]; }
      });
      pts.push([val[ix], val[iy], iF >= 0 ? val[iF] : null]);
    }
    if (!pts.length) continue;
    const bref = (tr.getAttribute('brushRef') || '').replace('#', ''); const br = brushes[bref] || {};
    const color = (br.color?.v || '#000000').slice(0, 7);
    let width = parseFloat(br.width?.v || '0'); if (br.width?.u === 'cm') width *= 1000; else if (br.width?.u === 'mm') width *= 100;
    const hl = (+br.transparency?.v || 0) > 0 || /rectangle/i.test(br.tip?.v || '');
    traces.push({ pts, color, width, hl });
  }
  if (!traces.length) return [];
  // Agrupa traços em blocos separados por espaços verticais grandes (~1,5 cm)
  traces.forEach(t => { t.minY = Math.min(...t.pts.map(p => p[1])); t.maxY = Math.max(...t.pts.map(p => p[1])); });
  traces.sort((a, b) => a.minY - b.minY);
  const groups = []; let g = null;
  for (const t of traces) { if (!g || t.minY > g.maxY + 1500) { g = { traces: [], maxY: -Infinity }; groups.push(g); } g.traces.push(t); g.maxY = Math.max(g.maxY, t.maxY); }
  const maxF = Math.max(1, ...traces.flatMap(t => t.pts.map(p => p[2] || 0)));
  return groups.map(gr => {
    const xs = gr.traces.flatMap(t => t.pts.map(p => p[0])), ys = gr.traces.flatMap(t => t.pts.map(p => p[1]));
    const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
    const span = Math.max((maxX - minX) * 1.08, 12000), pad = span * 0.03;
    const strokes = gr.traces.map(t => ({
      c: t.color, hl: t.hl ? 1 : 0, w: Math.max(0.0015, (t.width || 50) / span),
      p: t.pts.flatMap(([x, y, f]) => [(x - minX + pad) / span, (y - minY + pad) / span, f == null ? 0.5 : clamp(f / maxF, 0.05, 1)])
    }));
    return { hr: clamp((maxY - minY + pad * 2) / span, 0.06, 4), strokes };
  });
}

}
async function oneNotePageToSermon(page, secId) {
  const { html, inkml } = await MSGraph.pageContent(page.id);

    const src = img.getAttribute('src'); if (!src || imgMap[src]) continue;

}

  },
  async viewNotebooks() {

    const acc = MSGraph.account;
    const head = el('div', { class: 'on-acc' }, el('span', { text: acc ? `Conectado como ${acc.name || ''} (${acc.user || ''})` : 'Conectado' }),
      el('button', { class: 'btn link', text: 'Trocar conta', onclick: () => { MSGraph.logout(); this.viewLogin(); } }));

        el('b', { text: nb.displayName }), el('span', { class: 'muted small', text: [nb.isShared ? 'compartilhado' : '', nb.lastModifiedDateTime ? 'alterado em ' + new Date(nb.lastModifiedDateTime).toLocaleDateString('pt-BR') : '', done ? `${done} já importada(s)` : ''].filter(Boolean).join(' · ') })));
    }
    const link = el('input', { class: 'inp', placeholder: 'Ou cole o link do caderno compartilhado (conta de trabalho/escola)' });
    const go = el('button', { class: 'btn', text: 'Abrir link', onclick: async () => {
      const u = link.value.trim(); if (!u) return;

      try { const nb = await MSGraph.notebookFromLink(u.replace(/^onenote:/, '')); this.viewSections({ id: nb.id, displayName: nb.name || nb.displayName || 'Caderno compartilhado' }); }
      catch (e) { go.disabled = false; UI.toast(MSGraph.account?.personal ? 'Abrir por link só funciona com conta de trabalho/escola. Com conta pessoal, o caderno compartilhado aparece na lista acima depois que você o abre uma vez no OneNote.' : 'Não consegui abrir o link: ' + e.message); }
    } });
    this.set(head, el('h4', { text: 'Escolha o caderno' }), box, el('div', { class: 'on-link' }, link, go));
  },
  async viewSections(nb) {
    this.set(el('p', { class: 'muted', text: `Lendo as seções de “${nb.displayName}”…` }));
    let secs;
    try { secs = await MSGraph.sectionTree(nb.id); } catch (e) { return this.set(el('p', { text: 'Erro: ' + e.message }), el('button', { class: 'btn', text: 'Voltar', onclick: () => this.viewNotebooks() })); }
    const checks = secs.map(s => { const c = el('input', { type: 'checkbox', checked: true }); c._sec = s; return c; });
    const all = el('input', { type: 'checkbox', checked: true, onchange: e => checks.forEach(c => c.checked = e.target.checked) });
    const upd = el('input', { type: 'checkbox' });
    this.set(
      el('div', { class: 'on-acc' }, el('button', { class: 'btn link', text: '‹ Cadernos', onclick: () => this.viewNotebooks() }), el('b', { text: nb.displayName })),
      el('label', { class: 'on-check all' }, all, ` Todas as seções (${secs.length})`),
      el('div', { class: 'on-list' }, secs.map((s, i) => el('label', { class: 'on-check' }, checks[i], ' ' + s.path))),
      el('label', { class: 'on-check' }, upd, ' Trazer de novo as páginas que mudaram no OneNote desde a última importação'),
      el('p', { class: 'muted small', text: 'Cada seção vira uma seção do SmartSermon dentro de um caderno com o mesmo nome. Páginas já importadas não se repetem — se a importação parar, é só rodar de novo.' }),
      el('div', { class: 'row-btns' }, el('button', { class: 'btn primary', text: 'Importar', onclick: () => {
        const chosen = checks.filter(c => c.checked).map(c => c._sec); if (!chosen.length) return UI.toast('Escolha ao menos uma seção');
        this.run(nb, chosen, { update: upd.checked });
      } })));
  },
  async run(nb, secs, opts) {
    this.cancelled = false;
    const bar = el('div', { class: 'progress' }, el('div')), line = el('p', { text: 'Preparando…' }), stat = el('p', { class: 'muted small' }), log = el('div', { class: 'on-log' });
    const stop = el('button', { class: 'btn', text: 'Parar', onclick: () => { this.cancelled = true; stop.disabled = true; stop.textContent = 'Parando…'; } });
    this.set(el('h4', { text: 'Importando “' + nb.displayName + '”' }), line, bar, stat, log, el('div', { class: 'row-btns' }, stop));
    MSGraph.onWait = s => { line.textContent = `A Microsoft pediu uma pausa de ${s}s (limite de requisições)… continuando em seguida.`; };
    const c = { new: 0, upd: 0, skip: 0, err: 0, total: 0 };
    // caderno e seções no SmartSermon
    let mpNb = App.meta.notebooks.find(n => n.src === nb.id);
    if (!mpNb) { mpNb = { id: uid(), name: nb.displayName, color: SECTION_COLORS[App.meta.notebooks.length % 10], src: nb.id }; App.meta.notebooks.push(mpNb); }
    const bySrc = new Map(); for (const s of App.sermons.values()) if (s.source?.onenote) bySrc.set(s.source.onenote, s);
    try {
      // conta páginas primeiro, para a barra de progresso
      const plan = [];
      for (const sec of secs) { if (this.cancelled) break; line.textContent = `Listando páginas: ${sec.path}…`; const pages = await MSGraph.pages(sec.id); plan.push({ sec, pages }); c.total += pages.length; stat.textContent = `${c.total} página(s) encontradas`; }
      let n = 0;
      for (const { sec, pages } of plan) {
        if (this.cancelled) break;
        let mpSec = App.meta.sections.find(s => s.src === sec.id);
        if (!mpSec) { mpSec = { id: uid(), nb: mpNb.id, name: sec.path, color: SECTION_COLORS[App.meta.sections.length % 10], src: sec.id }; App.meta.sections.push(mpSec); }
        App.saveMeta();
        for (const page of pages) {
          if (this.cancelled) break;
          n++; bar.firstChild.style.width = (n / Math.max(1, c.total) * 100).toFixed(1) + '%';
          const ex = bySrc.get(page.id);
          if (ex && !(opts.update && page.lastModifiedDateTime && page.lastModifiedDateTime > (ex.source.modified || ''))) { c.skip++; stat.textContent = `${c.new} nova(s) · ${c.upd} atualizada(s) · ${c.skip} já existiam · ${c.err} com erro`; continue; }
          line.textContent = `${sec.path} — ${page.title || 'Sem título'} (${n}/${c.total})`;
          try {
            const s = await oneNotePageToSermon(page, mpSec.id);
            s.source.nb = nb.id;
            if (ex) { s.id = ex.id; s.created = ex.created; s.preached = ex.preached; s.settings = ex.settings; c.upd++; } else c.new++;
            App.sermons.set(s.id, s); bySrc.set(page.id, s); await DB.put('sermons', s.id, s);
          } catch (e) {
            if (e.status === 401) throw e;
            c.err++; log.append(el('div', { class: 'small', text: `⚠ ${page.title || page.id}: ${e.message}` }));
          }
          stat.textContent = `${c.new} nova(s) · ${c.upd} atualizada(s) · ${c.skip} já existiam · ${c.err} com erro`;
        }
      }
    } catch (e) {
      log.append(el('div', { class: 'small', text: '⚠ ' + (e.status === 401 ? 'A sessão expirou. Entre de novo e rode a importação — continua de onde parou.' : e.message) }));
    }
    MSGraph.onWait = null;
    await DB.put('kv', 'meta', App.meta);
    App.meta.currentNb = mpNb.id; App.meta.currentSec = App.meta.sections.find(s => s.nb === mpNb.id)?.id || App.meta.currentSec;
    App.renderNav();
    const first = App.sectionSermons(App.meta.currentSec)[0]; if (first) App.open(first.id);
    line.textContent = this.cancelled ? 'Importação interrompida. Rode de novo para continuar de onde parou.' : 'Importação concluída.';
    bar.firstChild.style.width = '100%';
    stop.replaceWith(el('button', { class: 'btn primary', text: 'Fechar', onclick: () => this.m.close() }), el('button', { class: 'btn', text: 'Importar outro caderno', onclick: () => this.viewNotebooks() }));
  }
};

/* Janela de login: devolve o código para a janela principal e fecha */
function handleAuthPopup() {
  const q = new URLSearchParams(location.search);
  if (!q.has('state') || !(q.has('code') || q.has('error'))) return false;
  try { localStorage.setItem('mp-auth', location.search); } catch (e) { }
  try { window.opener && window.opener.postMessage({ type: 'mp-auth', search: location.search }, location.origin); } catch (e) { }
  document.body.innerHTML = '<div style="font:16px Segoe UI,sans-serif;padding:40px;text-align:center">Login concluído. Você pode fechar esta janela.</div>';
  setTimeout(() => window.close(), 300);
  return true;
}

/* ===== Nuvem (Supabase): login e sincronização entre aparelhos =====
   Offline-first: o app trabalha sempre na cópia local (IndexedDB) e sincroniza em segundo plano.
   Sem bibliotecas: fala direto com as APIs REST do Supabase (Auth, PostgREST e Storage). */
const Cloud = {
  session: null, status: 'off', syncing: false, again: false, lastError: '', timer: null,
  st: { synced: {}, tombs: {}, lastPull: 0, lastMeta: 0, metaSynced: 0, at: 0 }, // estado de sincronização (por aparelho)

  /* ---------- configuração ---------- */
  cfg() {
    let local = {}; try { local = JSON.parse(localStorage.getItem('ss-cloud') || '{}'); } catch (e) { }
    const g = window.SMARTSERMON_CONFIG || {};
    const url = (local.url || g.supabaseUrl || '').trim().replace(/\/+$/, '');
    const key = (local.key || g.supabaseAnonKey || '').trim();
    return { url, key };
  },
  configured() { const c = this.cfg(); return /^https:\/\/.+/.test(c.url) && c.key.length > 20; },
  saveCfg(url, key) { try { localStorage.setItem('ss-cloud', JSON.stringify({ url, key })); } catch (e) { } },
  redirect() { return location.origin + location.pathname; },

  /* ---------- sessão ---------- */
  loadSession() { try { this.session = JSON.parse(localStorage.getItem('ss-session') || 'null'); } catch (e) { this.session = null; } },
  saveSession(s) { this.session = s; try { s ? localStorage.setItem('ss-session', JSON.stringify(s)) : localStorage.removeItem('ss-session'); } catch (e) { } },
  sessionFrom(j) { return { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() + ((+j.expires_in || 3600) - 60) * 1000, user: j.user ? { id: j.user.id, email: j.user.email } : this.session?.user }; },
  userFromToken(t) { try { const c = JSON.parse(decodeURIComponent(escape(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))))); return { id: c.sub, email: c.email }; } catch (e) { return null; } },
  /* Volta do Google / link mágico: tokens chegam no #hash da URL */
  captureRedirect() {
    const h = new URLSearchParams(location.hash.slice(1));
    if (h.get('access_token')) {
      const s = this.sessionFrom({ access_token: h.get('access_token'), refresh_token: h.get('refresh_token'), expires_in: h.get('expires_in') });
      s.user = this.userFromToken(s.access_token); this.saveSession(s);
      history.replaceState(null, '', location.pathname + location.search);
      return 'ok';
    }
    if (h.get('error_description') || h.get('error')) { const m = h.get('error_description') || h.get('error'); history.replaceState(null, '', location.pathname + location.search); return m; }
    return null;
  },
  async auth(path, body, method = 'POST') {
    const c = this.cfg();
    const r = await fetch(`${c.url}/auth/v1/${path}`, { method, headers: { apikey: c.key, 'Content-Type': 'application/json', ...(this.session && path === 'user' ? { Authorization: 'Bearer ' + this.session.access_token } : {}) }, body: body ? JSON.stringify(body) : undefined });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(this.authMsg(j.error_description || j.msg || j.message || j.error || ('Erro ' + r.status)));
    return j;
  },
  authMsg(m) {
    const map = [[/Invalid login credentials/i, 'E-mail ou senha incorretos.'], [/Email not confirmed/i, 'Confirme seu e-mail: abra o link que o Supabase enviou e depois entre de novo.'],
      [/User already registered/i, 'Este e-mail já tem conta. Use “Entrar”.'], [/Password should be at least/i, 'A senha precisa ter pelo menos 6 caracteres.'],
      [/rate limit|For security purposes/i, 'Muitas tentativas seguidas. Aguarde um minuto e tente de novo.'], [/provider is not enabled|Unsupported provider/i, 'O login com Google não está ativado no seu projeto Supabase (Authentication › Providers › Google).']];
    for (const [rx, t] of map) if (rx.test(m)) return t; return m;
  },
  async signIn(email, password) { const j = await this.auth('token?grant_type=password', { email, password }); this.saveSession(this.sessionFrom(j)); },
  async signUp(email, password) {
    const j = await this.auth(`signup?redirect_to=${encodeURIComponent(this.redirect())}`, { email, password });
    if (j.access_token) { this.saveSession(this.sessionFrom(j)); return 'in'; }
    return 'confirm';
  },
  async magicLink(email) { await this.auth(`otp?redirect_to=${encodeURIComponent(this.redirect())}`, { email, create_user: true }); },
  async providers() {
    if (this._prov) return this._prov;
    try { const c = this.cfg(); const r = await fetch(`${c.url}/auth/v1/settings`, { headers: { apikey: c.key } }); const j = await r.json(); this._prov = j.external || {}; } catch (e) { this._prov = {}; }
    return this._prov;
  },
  google() { const c = this.cfg(); location.href = `${c.url}/auth/v1/authorize?provider=google&redirect_to=${encodeURIComponent(this.redirect())}`; },
  async signOut() {
    try { const c = this.cfg(); await fetch(`${c.url}/auth/v1/logout`, { method: 'POST', headers: { apikey: c.key, Authorization: 'Bearer ' + this.session?.access_token } }); } catch (e) { }
    this.saveSession(null); this.setStatus('out');
  },
  async token() {
    if (!this.session) throw Object.assign(new Error('Entre na sua conta'), { auth: true });
    if (Date.now() < this.session.expires_at) return this.session.access_token;
    const c = this.cfg();
    const r = await fetch(`${c.url}/auth/v1/token?grant_type=refresh_token`, { method: 'POST', headers: { apikey: c.key, 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: this.session.refresh_token }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { if (r.status >= 400 && r.status < 500) { this.saveSession(null); throw Object.assign(new Error('Sessão expirada. Entre novamente.'), { auth: true }); } throw new Error('Sem conexão com o Supabase'); }
    this.saveSession(this.sessionFrom(j)); return this.session.access_token;
  },
  async rest(path, opts = {}) {
    const c = this.cfg(); const t = await this.token();
    const r = await fetch(`${c.url}${path}`, { ...opts, headers: { apikey: c.key, Authorization: 'Bearer ' + t, ...(opts.headers || {}) } });
    if (r.status === 401) { this.session.expires_at = 0; throw Object.assign(new Error('Sessão expirada'), { retry: true }); }
    if (!r.ok) { let m = 'Erro ' + r.status; try { const j = await r.json(); m = j.message || j.error || m; } catch (e) { } if (/relation .* does not exist|Could not find the table/i.test(m)) m = 'As tabelas não existem no Supabase. Rode o script supabase.sql no SQL Editor.'; throw new Error(m); }
    return r;
  },

  /* ---------- estado ---------- */
  async init() {
    this.loadSession();
    const back = this.captureRedirect();
    this.st = Object.assign(this.st, (await DB.get('kv', 'sync')) || {});
    window.addEventListener('online', () => this.schedule(500));
    window.addEventListener('offline', () => this.setStatus('offline'));
    document.addEventListener('visibilitychange', () => { if (!document.hidden) this.schedule(800); });
    window.addEventListener('storage', e => { if (e.key === 'ss-session') { this.loadSession(); this.schedule(300); } }); // login feito em outra aba/janela
    $('#btn-cloud').onclick = () => CloudUI.open();
    if (back === 'ok') UI.toast('Conectado à nuvem. Sincronizando…'); else if (back) UI.toast('Login: ' + back);
    this.timer = setInterval(() => this.schedule(0), 90000);
    if (!this.configured()) this.setStatus('setup'); else if (!this.session) this.setStatus('out'); else this.schedule(300);
  },
  saveState: debounce(() => DB.put('kv', 'sync', Cloud.st), 300),
  setStatus(s, extra) {
    this.status = s; const b = $('#btn-cloud'); if (!b) return;
    const L = { setup: ['☁', 'Configurar nuvem'], out: ['☁', 'Entrar'], syncing: ['⟳', 'Sincronizando…'], ok: ['☁✓', 'Sincronizado'], offline: ['☁', 'Offline'], error: ['☁!', 'Erro na sincronização'], pending: ['☁', 'Alterações pendentes'] }[s];
    b.textContent = L[0] + ' ' + L[1]; b.dataset.state = s;
    b.title = s === 'ok' ? `Sincronizado às ${new Date(this.st.at).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}` : (extra || L[1]);
  },
  /* chamado sempre que algo muda localmente */
  schedule(ms = 4000) {
    if (!this.configured() || !this.session) return;
    clearTimeout(this._t); this._t = setTimeout(() => this.sync(), ms);
    if (this.status === 'ok') this.setStatus('pending');
  },
  tomb(id) { this.st.tombs[id] = Date.now(); delete this.st.synced[id]; this.saveState(); this.schedule(); },

  /* ---------- sincronização ---------- */
  async sync() {
    if (!this.configured() || !this.session) return;
    if (!navigator.onLine) return this.setStatus('offline');
    if (this.syncing) { this.again = true; return; }
    this.syncing = true; this.setStatus('syncing');
    try {
      App.flush();
      await this.syncMeta();
      await this.pull();
      await this.push();
      this.st.at = Date.now(); this.saveState(); this.lastError = '';
      this.setStatus('ok');
    } catch (e) {
      console.warn('sync', e); this.lastError = e.message;
      if (e.auth) this.setStatus('out', e.message); else if (!navigator.onLine) this.setStatus('offline'); else this.setStatus('error', e.message);
      if (e.retry && !this._retried) { this._retried = true; this.syncing = false; return this.sync(); }
    } finally { this.syncing = false; this._retried = false; }
    if (this.again) { this.again = false; this.schedule(1500); }
  },
  uid() { return this.session.user?.id || this.userFromToken(this.session.access_token)?.id; },

  /* Cadernos/seções/tipos: une por id; o mais recente vence nos itens em comum; exclusões viajam como lista */
  metaPayload() {
    const m = App.meta;
    return { notebooks: m.notebooks, sections: m.sections, customTypes: m.customTypes || [], deleted: m.deleted || {}, theme: m.theme, readerTheme: m.readerTheme, readerSerif: !!m.readerSerif, ai: (typeof AI !== 'undefined' && AI.cloudPayload()) || undefined };
  },
  async syncMeta() {
    const r = await this.rest('/rest/v1/user_meta?select=data,updated_at,server_updated');
    const rows = await r.json(); const remote = rows[0];
    const m = App.meta; m.deleted ||= {}; m.metaUpdated ||= 0;
    let changed = false;
    if (remote && remote.server_updated > this.st.lastMeta) {
      const rd = remote.data || {}; const del = { ...(rd.deleted || {}), ...m.deleted }; m.deleted = del;
      const firstTime = !this.st.metaSynced;
      const merge = (loc, rem, key) => {
        const out = []; const byId = new Map(loc.map(x => [x.id, x]));
        for (const x of rem || []) {
          if (del[x.id]) continue;
          if (firstTime && !byId.has(x.id)) { // primeira vez neste aparelho: junta itens com o mesmo nome em vez de duplicar
            const twin = loc.find(l => !rem.some(r2 => r2.id === l.id) && l.name === x.name && (key !== 'sections' || (l.nb === x.nb || this.remapNb?.[l.nb] === x.nb)));
            if (twin) { this.remap(key, twin.id, x.id); byId.delete(twin.id); }
          }
          const l = byId.get(x.id);
          out.push(l && m.metaUpdated > remote.updated_at ? l : x); byId.delete(x.id);
        }
        for (const l of byId.values()) if (!del[l.id] && !(rem || []).some(x => x.id === l.id)) out.push(l);
        if (m.metaUpdated > remote.updated_at) { const pos = new Map(loc.map((x, i) => [x.id, i])); out.sort((a, b) => (pos.get(a.id) ?? 1e9) - (pos.get(b.id) ?? 1e9)); } // ordem local mais recente
        return out;
      };
      this.remapNb = {};
      m.notebooks = merge(m.notebooks, rd.notebooks, 'notebooks');
      m.sections = merge(m.sections.map(s => ({ ...s, nb: this.remapNb[s.nb] || s.nb })), rd.sections, 'sections');
      m.customTypes = merge(m.customTypes || [], rd.customTypes, 'customTypes');
      if (remote.updated_at > m.metaUpdated) { if (rd.theme) m.theme = rd.theme; if (rd.readerTheme) m.readerTheme = rd.readerTheme; if (rd.readerSerif != null) m.readerSerif = rd.readerSerif; }
      try { AI.fromCloud(rd.ai); } catch (e) { }
      this.st.lastMeta = remote.server_updated; changed = true;
      if (!m.notebooks.length) { const nb = { id: uid(), name: 'Ministrações', color: '#7719aa' }; m.notebooks.push(nb); }
      if (!m.notebooks.some(n => n.id === m.currentNb)) m.currentNb = m.notebooks[0].id;
      if (!m.sections.some(s => s.id === m.currentSec)) m.currentSec = m.sections.find(s => s.nb === m.currentNb)?.id || null;
      registerCustomTypes(); await DB.put('kv', 'meta', m);
    }
    if (!remote || m.metaUpdated > (this.st.metaSynced || 0) || changed) {
      const body = { user_id: this.uid(), data: this.metaPayload(), updated_at: Math.max(m.metaUpdated, remote?.updated_at || 0) };
      const r2 = await this.rest('/rest/v1/user_meta?on_conflict=user_id', { method: 'POST', headers: { 'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates,return=representation' }, body: JSON.stringify(body) });
      const saved = (await r2.json())[0]; if (saved) this.st.lastMeta = saved.server_updated;
      this.st.metaSynced = Date.now();
    }
    if (changed) { App.renderNav(); Ribbon.renderCustom(); Theme.apply(); }
  },
  remap(key, from, to) {
    const m = App.meta;
    if (key === 'notebooks') { this.remapNb[from] = to; m.sections.forEach(s => { if (s.nb === from) s.nb = to; }); if (m.currentNb === from) m.currentNb = to; }
    if (key === 'sections') { for (const s of App.sermons.values()) if (s.sec === from) { s.sec = to; App.touch(s); } if (m.currentSec === from) m.currentSec = to; }
  },

  async pull() {
    const before = App.cur && JSON.stringify(App.cur);
    let n = 0, conflicts = 0, cursor = this.st.lastPull || 0, more = true; const conflictIds = new Set();
    while (more) {
      // 1) lista leve (sem conteúdo) do que mudou desde a última vez
      const r = await this.rest(`/rest/v1/sermons?select=id,updated_at,deleted,server_updated&server_updated=gt.${cursor}&order=server_updated.asc&limit=500`);
      const rows = await r.json(); more = rows.length === 500;
      const need = [];
      for (const row of rows) {
        cursor = Math.max(cursor, row.server_updated);
        const local = App.sermons.get(row.id);
        if (this.st.tombs[row.id] && !row.deleted) continue;
        if (row.deleted) {
          if (local && local.updated <= row.updated_at) { App.sermons.delete(row.id); await DB.del('sermons', row.id); n++; }
          this.st.synced[row.id] = row.updated_at; continue;
        }
        if (local) {
          const synced = this.st.synced[row.id] || 0;
          if (row.updated_at === synced) continue;                                      // é o que já temos (eco do nosso envio)
          if (local.updated === row.updated_at) { this.st.synced[row.id] = row.updated_at; continue; }
          if (local.updated > synced && synced) { need.push(row.id); conflictIds.add(row.id); continue; } // mudou nos dois lados
          if (row.updated_at < local.updated) continue;
        }
        need.push(row.id);
      }
      // 2) baixa o conteúdo só do que precisa
      for (let i = 0; i < need.length; i += 40) {
        const ids = need.slice(i, i + 40).map(x => `"${x}"`).join(',');
        const r2 = await this.rest(`/rest/v1/sermons?select=id,data,updated_at&id=in.(${encodeURIComponent(ids)})`);
        for (const row of await r2.json()) {
          const local = App.sermons.get(row.id);
          if (local && conflictIds.has(row.id)) { // os dois lados mudaram: a versão da nuvem fica, a deste aparelho vira cópia
            const copy = structuredClone(local); copy.id = uid(); copy.title = `${local.title} (conflito — outra versão, ${new Date(local.updated).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })})`; copy.updated = Date.now();
            App.sermons.set(copy.id, copy); await DB.put('sermons', copy.id, copy); conflicts++;
          }
          const s = row.data; s.id = row.id; s.updated = row.updated_at;
          await this.inflateImages(s);
          App.sermons.set(s.id, s); await DB.put('sermons', s.id, s);
          this.st.synced[s.id] = row.updated_at; n++;
        }
      }
      this.st.lastPull = cursor; this.saveState();
    }
    if (n || conflicts) {
      App.renderNav();
      if (App.cur && !App.sermons.has(App.cur.id)) { App.cur = null; App.renderEditor(); }
      else if (App.cur) {
        const fresh = App.sermons.get(App.cur.id);
        if (fresh !== App.cur && JSON.stringify(fresh) !== before) {
          const editing = document.activeElement && $('#editor').contains(document.activeElement);
          if (editing) UI.toast('Esta ministração foi alterada em outro aparelho.', { label: 'Recarregar', fn: () => App.open(fresh.id) });
          else { App.cur = fresh; App.renderEditor(); }
        }
      }
      if (conflicts) UI.toast(`${conflicts} ministração(ões) editada(s) nos dois aparelhos — guardei as duas versões.`);
    }
  },
  async push() {
    const uidv = this.uid();
    const rows = [];
    for (const [id, ts] of Object.entries(this.st.tombs)) rows.push({ user_id: uidv, id, data: {}, updated_at: ts, deleted: true, _tomb: true });
    for (const s of App.sermons.values()) {
      if (s.welcome) continue;
      if ((this.st.synced[s.id] || 0) >= s.updated) continue;
      if (await this.uploadImages(s)) await DB.put('sermons', s.id, s);
      rows.push({ user_id: uidv, id: s.id, data: this.outbound(s), updated_at: s.updated, deleted: false });
    }
    if (!rows.length) return;
    // envia em lotes de até ~1,5 MB
    let batch = [], size = 0;
    const send = async () => {
      if (!batch.length) return;
      const body = JSON.stringify(batch.map(({ _tomb, ...r }) => r));
      await this.rest('/rest/v1/sermons?on_conflict=user_id,id', { method: 'POST', headers: { 'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates,return=minimal' }, body });
      for (const r of batch) { this.st.synced[r.id] = r.updated_at; if (r._tomb) delete this.st.tombs[r.id]; }
      this.saveState(); batch = []; size = 0;
    };
    for (const r of rows) { const len = JSON.stringify(r.data).length; if (size + len > 1500000) await send(); batch.push(r); size += len; }
    await send();
  },
  /* cópia para a nuvem: imagens viram referência ao Storage */
  outbound(s) {
    const c = structuredClone(s);
    c.blocks.forEach(b => { if (b.type === 'image' && b.cloud) b.src = ''; });
    return c;
  },
  async uploadImages(s) {
    let changed = false;
    for (const b of s.blocks) {
      if (b.type !== 'image' || !b.src || b.cloud || !b.src.startsWith('data:')) continue;
      const { bytes, mime } = dataURLtoBytes(b.src);
      const hash = [...new Uint8Array(await crypto.subtle.digest('SHA-256', bytes))].map(x => x.toString(16).padStart(2, '0')).join('').slice(0, 32);
      const path = `${this.uid()}/${hash}.${mime === 'image/png' ? 'png' : 'jpg'}`;
      await this.rest(`/storage/v1/object/images/${path}`, { method: 'POST', headers: { 'Content-Type': mime, 'x-upsert': 'true' }, body: bytes });
      b.cloud = path; await DB.put('images', path, b.src); changed = true;
    }
    return changed;
  },
  async inflateImages(s) {
    for (const b of s.blocks || []) {
      if (b.type !== 'image' || b.src || !b.cloud) continue;
      let d = await DB.get('images', b.cloud);
      if (!d) { try { const r = await this.rest(`/storage/v1/object/authenticated/images/${b.cloud}`); const blob = await r.blob(); d = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(blob); }); await DB.put('images', b.cloud, d); } catch (e) { console.warn('imagem', e); } }
      if (d) b.src = d;
    }
  }
};

/* ===== Inteligência artificial: Claude (Anthropic) e Gemini (Google), direto do navegador =====
   As chaves ficam só neste aparelho (localStorage). Nada passa por servidor nosso. */
const AI = {
  cfg() {
    let c = {}; try { c = JSON.parse(localStorage.getItem('ss-ai') || '{}'); } catch (e) { }
    return { anthropicKey: c.anthropicKey || '', geminiKey: c.geminiKey || '', claudeModel: c.claudeModel || 'claude-sonnet-5-5', geminiModel: c.geminiModel || 'gemini-flash-latest', church: c.church ?? 'Igreja evangélica; cultos de domingo e células; público misto (membros e visitantes).', syncKeys: c.syncKeys !== false, at: c.at || 0 };
  },
  /* fromCloud: veio de outro aparelho (mantém o horário original e não reenvia) */
  save(c, { fromCloud = false } = {}) {
    c = { ...c, at: fromCloud ? (c.at || 0) : Date.now() };
    try { localStorage.setItem('ss-ai', JSON.stringify(c)); } catch (e) { }
    if (!fromCloud && typeof App !== 'undefined' && App.meta) App.saveMeta();
  },
  /* O que vai para a conta: com as chaves (padrão) ou só modelos e contexto */
  cloudPayload() {
    const c = this.cfg(); if (!c.at) return null;
    return c.syncKeys ? c : { ...c, anthropicKey: '', geminiKey: '' };
  },
  fromCloud(r) {
    if (!r || !r.at || r.at <= this.cfg().at) return false;
    const loc = this.cfg();
    this.save(r.syncKeys === false ? { ...r, anthropicKey: loc.anthropicKey, geminiKey: loc.geminiKey } : r, { fromCloud: true });
    return true;
  },
  has(p) { const c = this.cfg(); return p === 'claude' ? !!c.anthropicKey : p === 'gemini' ? !!c.geminiKey : !!(c.anthropicKey || c.geminiKey); },
  async claude(system, user, { maxTokens = 6000 } = {}) {
    const c = this.cfg();
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'x-api-key': c.anthropicKey, 'anthropic-version': '2023-06-01', 'content-type': 'application/json', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: c.claudeModel, max_tokens: maxTokens, system, messages: [{ role: 'user', content: user }] })
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error('Claude: ' + (j.error?.message || ('erro ' + r.status)));
    return (j.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
  },
  /* Modelos reserva quando o escolhido está sobrecarregado (503), sem cota (429) ou não existe (404) */
  GEMINI_FALLBACK: ['gemini-flash-latest', 'gemini-flash-lite-latest'],
  wait: ms => new Promise(r => setTimeout(r, ms)),
  async gemini(system, user, { json = true, onRetry } = {}) {
    const c = this.cfg();
    const models = [...new Set([c.geminiModel, ...this.GEMINI_FALLBACK])];
    const body = JSON.stringify({ systemInstruction: { parts: [{ text: system }] }, contents: [{ role: 'user', parts: [{ text: user }] }], ...(json ? { generationConfig: { responseMimeType: 'application/json' } } : {}) });
    let lastErr = '';
    for (const model of models) {
      for (let attempt = 0; attempt < 3; attempt++) {
        let r, j = {};
        try {
          r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, { method: 'POST', headers: { 'x-goog-api-key': c.geminiKey, 'content-type': 'application/json' }, body });
          j = await r.json().catch(() => ({}));
        } catch (e) { lastErr = 'sem conexão'; break; }
        if (r.ok) {
          this.lastGeminiModel = model;
          const parts = j.candidates?.[0]?.content?.parts || [];
          return parts.filter(p => !p.thought && p.text).map(p => p.text).join('');
        }
        lastErr = j.error?.message || ('erro ' + r.status);
        if (r.status === 401 || r.status === 403 || r.status === 400) throw new Error('Gemini: ' + lastErr); // chave/pedido: trocar de modelo não resolve
        if (r.status === 404) break;                                   // modelo não existe: vai para o próximo
        if (r.status === 503 || r.status === 500 || r.status === 429) {
          if (attempt < 2) { onRetry && onRetry(model, attempt + 1); await this.wait(attempt ? 5000 : 2000); continue; }
          break;                                                       // insistiu 3x: tenta o modelo reserva
        }
        throw new Error('Gemini: ' + lastErr);
      }
    }
    throw new Error('Gemini (todos os modelos ocupados ou indisponíveis — tente em alguns minutos): ' + lastErr);
  },
  ask(provider, system, user, opts) { return provider === 'gemini' ? this.gemini(system, user, opts) : this.claude(system, user, opts); },
  parseJSON(t) {
    if (!t) throw new Error('Resposta vazia');
    const s = t.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
    try { return JSON.parse(s); } catch (e) { }
    const a = s.indexOf('{'), b = s.lastIndexOf('}');
    if (a >= 0 && b > a) return JSON.parse(s.slice(a, b + 1));
    throw new Error('A IA não devolveu JSON válido');
  },

    const ch = el('textarea', { class: 'inp', rows: 2 }); ch.value = c.church;

    const body = el('div', { class: 'ai-set' },

/* ===== Checagem de referências (por código, sem IA) ===== */
async function checkReferences(s) {
  const out = [];
  const ver = Bible.current(); const books = ver ? await Bible.load(ver) : null;
  const words = t => new Set(stripAccents(t.toLowerCase()).replace(/[^a-z0-9\s]/g, ' ').split(/\s+/).filter(w => w.length > 3));
  const seen = new Set();
  const check = async (raw, where, text) => {
    const r = parseRef(raw); if (!r) return;
    const key = refLabel(r) + '|' + where; if (seen.has(key)) return; seen.add(key);
    if (!books) { out.push({ ref: refLabel(r), where, status: 'skip', msg: 'Baixe uma Bíblia para conferir.' }); return; }
    const bk = books[r.book - 1];
    if (!bk) { out.push({ ref: refLabel(r), where, status: 'warn', msg: 'Livro não está nesta versão.' }); return; }
    if (r.ch > bk.length) { out.push({ ref: refLabel(r), where, status: 'error', msg: `${BOOKS[r.book - 1].name} tem só ${bk.length} capítulos.` }); return; }
    const max = bk[r.ch - 1].length;
    const bad = r.ranges.find(([a, z]) => a > max || z > max || a < 1 || z < a);
    if (bad) { out.push({ ref: refLabel(r), where, status: 'error', msg: `${BOOKS[r.book - 1].name} ${r.ch} tem só ${max} versículos.` }); return; }
    if (text && text.length > 25 && r.ranges.length) {
      const res = await Bible.lookup(r, ver); const a = words(text), b = words(res.verses.map(v => v[1]).join(' '));
      const inter = [...a].filter(w => b.has(w)).length; const sim = inter / Math.max(1, Math.min(a.size, b.size));
      if (sim < 0.3) { out.push({ ref: refLabel(r), where, status: 'warn', msg: `O texto citado não parece ser desta referência (semelhança ${Math.round(sim * 100)}% com a ${Bible.info(ver).short}). Confira — pode ser só outra tradução.` }); return; }
    }
    out.push({ ref: refLabel(r), where, status: 'ok', msg: 'Referência válida.' });
  };
  if (s.passage) for (const p of s.passage.split(/;/)) await check(p.trim(), 'Texto-base');
  let n = 0;
  for (const b of s.blocks) {
    if (b.type === 'point') n++;
    const where = n ? `Ponto ${n}` : 'Introdução';
    if (b.type === 'verse' && b.ref) await check(b.ref, where, htmlToText(b.html || '').replace(/\b\d{1,3}\b/g, ' '));
    const t = htmlToText(b.html || ''); REF_IN_TEXT.lastIndex = 0; let m;
    while ((m = REF_IN_TEXT.exec(t))) await check(m[0], where);
  }
  return out;
}
